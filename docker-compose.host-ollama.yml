services:
  app:
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on: {}

  workflow-load-test:
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on: {}

  ollama-load-test:
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on: {}
    command:
      - python
      - tests/ollama_model_performance.py
      - --base-url
      - http://host.docker.internal:11434
      - --model
      - "${REASONING_MODEL:-llama3.2:latest}"
      - --requests
      - "${REQUESTS:-10}"
      - --concurrency
      - "${CONCURRENCY:-3}"
      - --warmup
      - "${WARMUP:-1}"
      - --output
      - /app/results/ollama_performance_results.json
