services:
  app:
    build: .
    image: agentic-ai-tutorial:local
    ports:
      - "${APP_PORT:-8501}:8501"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      REASONING_MODEL: ${REASONING_MODEL:-llama3.2:latest}
      ANALYSIS_MODEL: ${ANALYSIS_MODEL:-qwen2.5:latest}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text:latest}
      VECTOR_STORE_TYPE: ${VECTOR_STORE_TYPE:-faiss}
      PERSIST_DIRECTORY: /app/data/vector_store
    volumes:
      - app-data:/app/data
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:0.30.4
    environment:
      CUDA_VISIBLE_DEVICES: "-1"
      OLLAMA_LLM_LIBRARY: "cpu"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_DEBUG: "1"
      LLAMA_ARG_FIT: "off"
      LLAMA_ARG_REPACK: "false"
      LLAMA_ARG_THREADS: "32"
      LLAMA_ARG_THREADS_BATCH: "32"
      LLAMA_ARG_THREADS_HTTP: "16"
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  pull-models:
    image: ollama/ollama:latest
    profiles: ["setup"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until ollama list >/dev/null 2>&1; do
          echo "Waiting for Ollama..."
          sleep 2
        done
        ollama pull "$${REASONING_MODEL:-llama3.2:latest}"
        ollama pull "$${ANALYSIS_MODEL:-qwen2.5:latest}"
        ollama pull "$${EMBEDDING_MODEL:-nomic-embed-text:latest}"

  workflow-load-test:
    image: agentic-ai-tutorial:local
    profiles: ["perf"]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      REASONING_MODEL: ${REASONING_MODEL:-llama3.2:latest}
      ANALYSIS_MODEL: ${ANALYSIS_MODEL:-qwen2.5:latest}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text:latest}
      VECTOR_STORE_TYPE: ${VECTOR_STORE_TYPE:-faiss}
      PERSIST_DIRECTORY: /app/data/vector_store
    volumes:
      - app-data:/app/data
      - ./results:/app/results
    depends_on:
      ollama:
        condition: service_healthy
    command:
      - python
      - tests/performance_test1.py
      - --requests
      - "${REQUESTS:-10}"
      - --concurrency
      - "${CONCURRENCY:-3}"
      - --warmup
      - "${WARMUP:-1}"
      - --ticker
      - "${TICKER:-AAPL}"
      - --output
      - /app/results/workflow_performance_results.json

  ollama-load-test:
    image: agentic-ai-tutorial:local
    profiles: ["perf"]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ./results:/app/results
    depends_on:
      ollama:
        condition: service_healthy
    command:
      - python
      - tests/ollama_model_performance.py
      - --base-url
      - http://ollama:11434
      - --model
      - "${REASONING_MODEL:-llama3.2:latest}"
      - --requests
      - "${REQUESTS:-10}"
      - --concurrency
      - "${CONCURRENCY:-3}"
      - --warmup
      - "${WARMUP:-1}"
      - --output
      - /app/results/ollama_performance_results.json

volumes:
  app-data:
  ollama-data:
